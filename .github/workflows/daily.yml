name: daily-c-cssci

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
- uses: actions/checkout@v4
  with:
    fetch-depth: 0
    token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run fetch
        run: python fetch_c.py

- name: Commit data via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, os, sys, json, urllib.request, urllib.error
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          path = "data/daily_c.cssci.csv"
          msg = f"daily update {os.popen('date -u +%Y-%m-%d\\ %H:%M\\ UTC').read().strip()}"

          local = Path(path)
          if not local.exists():
              print("no csv file")
              sys.exit(0)

          content = local.read_bytes()
          b64 = base64.b64encode(content).decode()

          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          sha = None
          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  data = json.loads(r.read())
              sha = data.get("sha")
              remote_b64 = data.get("content", "").replace("\n", "")
              if remote_b64 and base64.b64decode(remote_b64) == content:
                  print("no changes")
                  sys.exit(0)
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          payload = {"message": msg, "content": b64}
          if sha:
              payload["sha"] = sha

          req2 = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              method="PUT",
              headers={**headers, "Content-Type": "application/json"}
          )
          with urllib.request.urlopen(req2) as r:
              print("updated", r.status)
          PY
