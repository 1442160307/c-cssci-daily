name: daily-c-cssci

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run fetch
        run: python fetch_c.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_c.cssci.csv || true
          git diff --cached --quiet || git commit -m "daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
